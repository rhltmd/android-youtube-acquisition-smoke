name: Build E2E QA APK

on:
  workflow_dispatch:
  push:
    branches: [codex/mobile-e2e-qa]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test and build arm64 debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Record checksums
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256

      - name: Verify packaged QA identity and record build evidence
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          tools = Path(os.environ["ANDROID_HOME"]) / "build-tools" / "35.0.0"
          badging = subprocess.check_output([str(tools / "aapt"), "dump", "badging", str(apk)], text=True)
          application_id = re.search(r"^package: name='([^']+)'", badging, re.M).group(1)
          label = re.search(r"^application-label:'([^']+)'", badging, re.M).group(1)
          assert application_id == "com.automusicshorts.acquisitionsmoke.audio.e2eqa"
          assert label == "Music Shorts E2E QA"
          signature = subprocess.check_output([
              str(tools / "apksigner"), "verify", "--print-certs", str(apk)
          ], text=True)
          signer = re.search(r"Signer #1 certificate SHA-256 digest: ([0-9a-f]+)", signature).group(1)
          suites = [ET.parse(path).getroot() for path in Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml")]
          tests = sum(int(suite.get("tests", 0)) for suite in suites)
          failures = sum(int(suite.get("failures", 0)) + int(suite.get("errors", 0)) for suite in suites)
          assert tests > 0 and failures == 0
          evidence = {
              "source_commit": os.environ["GITHUB_SHA"],
              "build_identifier": os.environ["GITHUB_SHA"][:12],
              "application_id": application_id,
              "application_label": label,
              "version_name": "0.2.0-e2e-qa",
              "unit_tests": tests,
              "unit_test_failures": failures,
              "apk_sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
              "signer_certificate_sha256": signer,
              "device_e2e": "NOT TESTED",
          }
          Path("qa-build-info.json").write_text(json.dumps(evidence, indent=2), encoding="utf-8")
          print(json.dumps(evidence, indent=2))

      - uses: actions/upload-artifact@v4
        with:
          name: music-shorts-e2e-qa-arm64-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
            qa-build-info.json
          if-no-files-found: error
          retention-days: 7
